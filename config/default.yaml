schema_version: "1.0"
dataset:
  version: "research-2.0.0"
  mode: historical_replay
  source: CryptoHFTData Binance Spot L2 order book and trades
  coverage_start_utc: "2025-06-28"
  coverage_end_utc: "2025-12-31"
  symbols: [BTCUSDT, ETHUSDT]
  processing_timestamp: received_time
  source_timestamp_unit: nanoseconds
  sampling:
    frequency_seconds: 1
    pilot_duration_seconds: null
    interval: "[coverage_start, coverage_end)"
    selection: last_valid_sequence_checked_book_state_in_each_utc_second
    fill_missing_seconds: false
  depth_levels: 20
features:
  horizons_seconds: [1, 5, 10]
  primary_horizon_seconds: 5
  trade_flow:
    window_seconds: 5
    timestamp: received_time
    interval: "(t-5s,t]"
    side_field: source_side
    side_semantics: "is_buyer_maker=false buyer aggressor; true seller aggressor"
    unknown_side: retain_and_exclude_from_signed_imbalance
  realized_volatility:
    window_seconds: 5
    sampling_seconds: 1
    estimator: sqrt_sum_squared_log_mid_returns
    gaps: null_until_five_contiguous_returns
  ofi:
    window_seconds: 5
    levels: 1
    timestamp: received_time
    group_equal_timestamps: true
    invalid_window_value: null
  depth_slope:
    minimum_levels_per_side: 5
    x_unit: basis_points_from_mid
    y_unit: cumulative_base_quantity
  obi_levels: [1, 5, 10, 20]
  trade_flow:
    window_seconds: 5
    timestamp: local_timestamp
    interval: "(t-5s,t]"
    side_semantics: liquidity_taker_aggressor
    unknown_side: retain_but_exclude_from_signed_imbalance
    require_complete_source_window: true
  realized_volatility:
    window_seconds: 5
    input: one_second_log_mid_returns
    require_contiguous_intervals: true
    aggregation: sqrt_sum_squared_returns
labels:
  enabled_for_pilot: false
  stress_percentile: 0.95
  direction_delta: null
splits:
  enabled_for_pilot: false
  policy: chronological_shared_utc_boundaries
  purge_seconds: 10
  target_ratios: [0.70, 0.15, 0.15]
storage:
  raw_source: data_raw/cryptohftdata
  normalized_research: data_processed/cryptohftdata
  qa_manifest: outputs/manifests/cryptohftdata_qa.json
  split_manifest: outputs/manifests/split_manifest_research.json
