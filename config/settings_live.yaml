# Runtime settings for the read-only replay API and live Binance collector.
# Offline research runs use config/settings.yaml and its isolated archive grid.
data:
  directory: data_processed/lob
  raw_directory: data_raw/binance_spot
  interim_directory: data_interim/binance_spot
binance:
  # Public market-data-only endpoint; rotate through official Spot REST alternatives if unavailable.
  base_url: https://data-api.binance.vision
  fallback_base_urls:
    - https://api.binance.com
    - https://api-gcp.binance.com
    - https://api1.binance.com
    - https://api2.binance.com
    - https://api3.binance.com
    - https://api4.binance.com
  timeout_seconds: 4
  retries: 2
lob:
  collection_enabled: true
  websocket_base_url: wss://stream.binance.com:443
  websocket_fallback_urls:
    - wss://data-stream.binance.vision:443
    - wss://stream.binance.com:9443
  # 100 levels cover the displayed top-20 book and minimize REST snapshot latency/weight.
  depth_snapshot_limit: 100
  update_speed: 100ms
  sampling_interval_seconds: 1
  stale_after_seconds: 5
  raw_file_max_bytes: 67108864
  flush_rows: 500
  flush_seconds: 10
  temporal_history_samples: 3600
  classification_horizons_seconds: [1, 5, 10]
  primary_horizon_seconds: 5
  depth_levels: 20
  direction_delta_quantile: 0.5
  # Composite stress combines upper spread/impact/RV tails and low depth.
  # It avoids a degenerate label when spread_ticks has a large point mass at one tick.
  stress_definition: composite
  stress_quantile: 0.975
  stress_depth_quantile: 0.025
  spread_sensitivity_quantile: 0.95
  stress_min_positive_rate: 0.02
  stress_max_positive_rate: 0.10
  # Must match the notional the served artifacts were trained with (config/settings_6m.yaml);
  # the API refuses an artifact whose training notional differs.
  stress_impact_notional_by_symbol:
    BTCUSDT: 2000
    ETHUSDT: 2000
  tick_size_by_symbol:
    BTCUSDT: 0.01
    ETHUSDT: 0.01
  max_missing_feature_fraction: 0.10
  max_staleness_seconds: 2
  # Models served by the API: the six-month study, scored once on 2026-08-24 to 2026-09-27.
  artifact_directory: backend/artifacts/meter_6m
  evaluation_directory: outputs/tables/final_test_6m
  # Runtime-only compatibility values. The research splits live in config/settings_6m.yaml
  # (six-month study) and config/settings.yaml (October pilot).
  first_validation_week_utc: "2026-10-05T00:00:00Z"
  development_end_utc: "2026-10-11T23:59:59Z"
  untouched_test_start_utc: "2026-10-12T00:00:00Z"
  untouched_test_end_utc: "2026-10-18T23:59:59Z"
  embargo_seconds: 300
  feature_lookback_seconds: 300
  deeplob_lookback_seconds: 100
  deeplob_max_train_rows: 8000
