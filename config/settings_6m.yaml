# Six-month walk-forward study, frozen on 2026-10-27 before any model sees this data.
#
# Data: CryptoHFTData Binance Spot archive 2026-04-19 to 2026-10-18, unified grid built by
# backend/scripts/build_unified_6m_grid.py. Days before 2026-08-24 mostly use the
# warm-start (approximate) book; every day of the untouched test uses provider snapshots.
#
# Split:
#   development  2026-04-19 .. 2026-08-23  expanding weekly walk-forward; validation weeks
#                                          start 2026-06-01 (six weeks of initial training)
#   untouched    2026-08-24 .. 2026-09-27  five full weeks, exact book only, scored once
#   pilot_seen   2026-09-28 .. 2026-10-18  already used by the archive pilot for model
#                                          selection and holdout scoring; reported only as a
#                                          secondary "previously seen" check, never as test
#
# The pilot configuration (settings.yaml) stays unchanged; it is the provenance of the saved
# pilot metrics.
data:
  directory: data_processed/cryptohftdata_6m_unified
  raw_directory: data_raw/cryptohftdata
  interim_directory: data_interim/cryptohftdata
binance:
  base_url: https://data-api.binance.vision
  fallback_base_urls:
    - https://api.binance.com
    - https://api-gcp.binance.com
    - https://api1.binance.com
    - https://api2.binance.com
    - https://api3.binance.com
    - https://api4.binance.com
  timeout_seconds: 4
  retries: 2
lob:
  collection_enabled: false
  websocket_base_url: wss://stream.binance.com:443
  websocket_fallback_urls:
    - wss://data-stream.binance.vision:443
    - wss://stream.binance.com:9443
  depth_snapshot_limit: 100
  update_speed: 100ms
  sampling_interval_seconds: 1
  stale_after_seconds: 5
  raw_file_max_bytes: 67108864
  flush_rows: 500
  flush_seconds: 10
  temporal_history_samples: 3600
  classification_horizons_seconds: [1, 5, 10]
  primary_horizon_seconds: 5
  depth_levels: 20
  direction_delta_quantile: 0.5
  stress_definition: composite
  stress_quantile: 0.975
  stress_depth_quantile: 0.025
  spread_sensitivity_quantile: 0.95
  stress_min_positive_rate: 0.02
  stress_max_positive_rate: 0.10
  # Revised 2026-10-28 on development data only (the untouched test was not opened): the
  # earlier 250,000 / 100,000 USDT could not be filled within the 20 visible levels in most
  # seconds, so the composite stress label was missing for 77-98% of them. Rule: the largest
  # notional on a fixed grid that both sides fill in >= 99% of valid seconds of the first
  # training segment (before 2026-06-01 minus the embargo). BTC fills 99.54%, ETH 99.13%.
  stress_impact_notional_by_symbol:
    BTCUSDT: 2000
    ETHUSDT: 2000
  tick_size_by_symbol:
    BTCUSDT: 0.01
    ETHUSDT: 0.01
  max_missing_feature_fraction: 0.10
  max_staleness_seconds: 2
  first_validation_week_utc: "2026-06-01T00:00:00Z"
  development_end_utc: "2026-08-23T23:59:59Z"
  untouched_test_start_utc: "2026-08-24T00:00:00Z"
  untouched_test_end_utc: "2026-09-27T23:59:59Z"
  embargo_seconds: 300
  feature_lookback_seconds: 300
  deeplob_lookback_seconds: 100
  deeplob_max_train_rows: 8000
