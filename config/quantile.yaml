# ARCHIVED: direct quantile settings for the retired candle/OHLCV study.
quantiles: [0.95, 0.975, 0.99]
refit_every_days: 30
min_train_rows: 100
models:
  linear_qr:
    alpha: 0.001
  lightgbm_quantile:
    n_estimators: 250
    learning_rate: 0.05
    num_leaves: 15
    min_child_samples: 30
  qrf:
    n_estimators: 250
    min_samples_leaf: 15
